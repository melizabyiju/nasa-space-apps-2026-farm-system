<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep Rich Emerald Green Pebble Gradient (from previous green color) -->
    <linearGradient id="richEmerald" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#008f58"/>
      <stop offset="50%" stop-color="#006d44"/>
      <stop offset="100%" stop-color="#004d2f"/>
    </linearGradient>

    <!-- Translucent Mint Orbital Glow Fill -->
    <linearGradient id="orbitGlow" x1="16" y1="46" x2="52" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#a7f3d0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Smooth Rounded Squircle Container -->
  <rect width="64" height="64" rx="20" fill="url(#richEmerald)"/>

  <!-- Orbital Ellipse: Back Arc & Translucent Plane -->
  <g transform="rotate(-24 32 35)">
    <!-- Subtle translucent orbital sweep fill -->
    <ellipse cx="32" cy="35" rx="22" ry="7.5" fill="url(#orbitGlow)"/>
    <!-- Mint Orbit Path -->
    <ellipse cx="32" cy="35" rx="22" ry="7.5" fill="none" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Orbiting Satellite Node (Upper-Right) -->
    <circle cx="51.5" cy="31" r="3" fill="#a7f3d0"/>
    <circle cx="51.5" cy="31" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Horizontal Ground Line (Solid Crisp White, Rounded Caps) -->
  <line x1="18" y1="47" x2="46" y2="47" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round"/>

  <!-- Vertical Sprout Stem -->
  <line x1="32" y1="47" x2="32" y2="24" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round"/>

  <!-- Apical Dot / Satellite Telemetry Beacon at Apex -->
  <circle cx="32" cy="18" r="2.4" fill="#ffffff"/>

  <!-- Left Leaf: Rounded Teardrop Loop -->
  <path d="M32 33 C23.5 33 19 26.5 21.5 21 C28 21 32.5 26.5 32 33 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3.8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Right Leaf: Rounded Teardrop Loop (Tilted Higher) -->
  <path d="M32 31 C32 22.5 37.5 16 44 17.5 C45 25 39.5 30 32 31 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3.8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
